<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Logo options · Lead Book</title>
<style>
  body { margin: 0; font: 15px/1.5 system-ui, sans-serif; background: #EDF0F3; color: #15202B; padding: 24px 16px; }
  @media (prefers-color-scheme: dark) { body { background: #0B141E; color: #E3EAF1; } }
  h1 { font-size: 26px; margin: 0 0 4px; } p { margin: 0 0 20px; opacity: .75; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 20px; max-width: 1000px; }
  figure { margin: 0; } .row { display: flex; align-items: center; gap: 14px; }
  .big { width: 120px; height: 120px; border-radius: 28px; } .round { width: 64px; height: 64px; border-radius: 50%; } .tiny { width: 24px; height: 24px; border-radius: 5px; }
  figcaption { margin-top: 10px; } figcaption b { display: block; }
</style></head><body>
<h1>Logo options</h1><p>Each shown as an app icon, Android's round mask, and a browser-tab favicon.</p>
<div class="grid">
  <figure><div class="row"><img class="big" src="a-roof-check.svg" alt=""><div><img class="round" src="a-roof-check.svg" alt=""><br><img class="tiny" src="a-roof-check.svg" alt=""></div></div><figcaption><b>A · Roof check</b>A house with a passed-inspection checkmark. A house with a passed-inspection check.</figcaption></figure>
  <figure><div class="row"><img class="big" src="b-lens-house.svg" alt=""><div><img class="round" src="b-lens-house.svg" alt=""><br><img class="tiny" src="b-lens-house.svg" alt=""></div></div><figcaption><b>B · Lens</b>A magnifying glass over a house. Light tile, stands out on dark home screens.</figcaption></figure>
  <figure><div class="row"><img class="big" src="c-inspection-tag.svg" alt=""><div><img class="round" src="c-inspection-tag.svg" alt=""><br><img class="tiny" src="c-inspection-tag.svg" alt=""></div></div><figcaption><b>C · Inspection tag</b>A checked inspection tag. The current app icon.</figcaption></figure>
  <figure><div class="row"><img class="big" src="d-roof-level.svg" alt=""><div><img class="round" src="d-roof-level.svg" alt=""><br><img class="tiny" src="d-roof-level.svg" alt=""></div></div><figcaption><b>D · Roof &amp; level</b>A roofline over a spirit level on blueprint grid.</figcaption></figure>
</div></body></html>
