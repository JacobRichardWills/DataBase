<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lead Book</title>
<meta name="description" content="Client planner for an inspection business: follow-ups, tasks, wins and history.">
<meta name="theme-color" content="#1F5594">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/favicon.svg" type="image/svg+xml">
<link rel="icon" href="icons/icon-192.png" type="image/png" sizes="192x192">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..125,500..800&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<script>
  // Set theme before first paint so there's no flash.
  (function () {
    try {
      var c = JSON.parse(localStorage.getItem('lb.cfg') || '{}');
      var t = c.theme || 'auto';
      if (t === 'auto') {
        var h = new Date().getHours();
        var from = c.lightFrom == null ? 7 : c.lightFrom, to = c.lightTo == null ? 19 : c.lightTo;
        t = (h >= from && h < to) ? 'light' : 'dark';
      }
      document.documentElement.dataset.theme = t;
    } catch (e) { document.documentElement.dataset.theme = 'light'; }
  })();
</script>
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <a class="brand" href="#dashboard" aria-label="Lead Book dashboard">
        <img src="icons/favicon.svg" alt="" width="32" height="32">
        <span class="brand-text">
          <span class="brand-name">Lead Book</span>
          <span class="brand-sub" id="brandSub"></span>
        </span>
      </a>
      <button class="sync-pill" id="syncPill" type="button" data-action="pill" aria-live="polite">
        <span class="dot"></span><span class="sync-text">Loading</span>
      </button>
    </header>

    <nav class="tabs" aria-label="Main">
      <a href="#dashboard" data-tab="dashboard"><svg viewBox="0 0 24 24"><rect x="3.5" y="3.5" width="7" height="9" rx="1.5"/><rect x="13.5" y="3.5" width="7" height="5" rx="1.5"/><rect x="3.5" y="15.5" width="7" height="5" rx="1.5"/><rect x="13.5" y="11.5" width="7" height="9" rx="1.5"/></svg><span>Dashboard</span></a>
      <a href="#clients" data-tab="clients"><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.6-3.6 3.2-5.5 6.5-5.5s5.9 1.9 6.5 5.5"/><path d="M16 4.8a3.4 3.4 0 0 1 0 6.4M18 14.8c2 .7 3.2 2.4 3.5 5.2"/></svg><span>Clients</span></a>
      <a href="#map" data-tab="map"><svg viewBox="0 0 24 24"><path d="M9 4 3.5 6v14L9 18l6 2 5.5-2V4L15 6z"/><path d="M9 4v14M15 6v14"/></svg><span>Map</span></a>
      <a href="#history" data-tab="history"><svg viewBox="0 0 24 24"><path d="M4 12a8 8 0 1 0 2.4-5.7"/><path d="M4 4v4h4"/><path d="M12 8v4.5l3 2"/></svg><span>History</span></a>
      <a href="#settings" data-tab="settings"><svg viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg><span>Settings</span></a>
    </nav>

    <main id="view" tabindex="-1"></main>
  </div>

  <button class="fab" id="fab" type="button" data-action="fab" aria-label="Add">
    <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
  </button>

  <div class="savebar" id="savebar" hidden>
    <button type="button" class="savebar-info" data-action="review">
      <b id="saveCount">0 changes</b><span>Saved on this device only</span>
    </button>
    <button type="button" class="btn undo-btn" data-action="undo">Undo</button>
    <button type="button" class="btn save-btn" data-action="save">Save changes</button>
  </div>

  <dialog id="sheet" aria-labelledby="sheetTitle"></dialog>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="app.js" type="module"></script>
</body>
</html>
